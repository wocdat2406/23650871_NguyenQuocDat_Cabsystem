openapi: 3.1.0
info:
  title: CAB Auth & Customer API
  version: 1.0.0-oas3.1
  description: Authentication and customer-account API mapped to FR01-FR04 and UC01-UC03/UC07.
servers:
- url: http://localhost:8080/api/v1
  description: Local development
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register customer account
      operationId: registerCustomer
      x-fr:
      - FR01
      x-ac:
      - AC01
      - AC02
      - AC03
      - AC04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fullName
              - phone
              - email
              - password
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 100
                phone:
                  type: string
                  pattern: "^\\+?[0-9]{9,15}$"
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "201":
          description: Customer account created
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
                    format: uuid
        "409":
          description: Request conflicts with the current resource state
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Request data is invalid
                  details:
                    type: array
                    items:
                      type: string
        "422":
          description: Request data failed validation
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Request data is invalid
                  details:
                    type: array
                    items:
                      type: string
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login
      operationId: login
      x-fr:
      - FR02
      x-ac:
      - AC05
      - AC06
      - AC07
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - identifier
              - password
              properties:
                identifier:
                  type: string
                  description: Email or phone
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required:
                - accessToken
                - tokenType
                - role
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    const: Bearer
                  role:
                    type: string
                    enum:
                    - CUSTOMER
                    - DRIVER
                    - OPERATION_STAFF
                    - MANAGEMENT
        "401":
          description: Authentication is required or token is invalid
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Request data is invalid
                  details:
                    type: array
                    items:
                      type: string
        "422":
          description: Request data failed validation
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Request data is invalid
                  details:
                    type: array
                    items:
                      type: string
  /customers/me:
    get:
      tags:
      - Customer
      summary: Get current customer profile
      operationId: getMyCustomerProfile
      x-fr:
      - FR03
      x-ac:
      - AC08
      - AC10
      security:
      - bearerAuth: []
      responses:
        "200":
          description: Current customer profile
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - fullName
                - phone
                - email
                - status
                properties:
                  id:
                    type: string
                    format: uuid
                  fullName:
                    type: string
                  phone:
                    type: string
                  email:
                    type: string
                    format: email
                  status:
                    type: string
                    enum:
                    - ACTIVE
                    - INACTIVE
        "401":
          description: Authentication is required or token is invalid
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Request data is invalid
                  details:
                    type: array
                    items:
                      type: string
    patch:
      tags:
      - Customer
      summary: Update current customer profile
      operationId: updateMyCustomerProfile
      x-fr:
      - FR03
      x-ac:
      - AC08
      - AC09
      - AC10
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 100
                phone:
                  type: string
                  pattern: "^\\+?[0-9]{9,15}$"
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Customer profile updated
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - fullName
                - phone
                - email
                - status
                properties:
                  id:
                    type: string
                    format: uuid
                  fullName:
                    type: string
                  phone:
                    type: string
                  email:
                    type: string
                    format: email
                  status:
                    type: string
                    enum:
                    - ACTIVE
                    - INACTIVE
        "401":
          description: Authentication is required or token is invalid
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Request data is invalid
                  details:
                    type: array
                    items:
                      type: string
        "409":
          description: Request conflicts with the current resource state
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Request data is invalid
                  details:
                    type: array
                    items:
                      type: string
        "422":
          description: Request data failed validation
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Request data is invalid
                  details:
                    type: array
                    items:
                      type: string
  /customers/me/rides:
    get:
      tags:
      - Customer
      summary: List current customer ride history
      operationId: listMyRideHistory
      x-fr:
      - FR04
      x-ac:
      - AC28
      - AC29
      - AC30
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        "200":
          description: Ride history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - rideId
                  - pickup
                  - destination
                  - status
                  - createdAt
                  properties:
                    rideId:
                      type: string
                      format: uuid
                    pickup:
                      type: string
                    destination:
                      type: string
                    status:
                      type: string
                    fareAmount:
                      type: number
                      minimum: 0
                    createdAt:
                      type: string
                      format: date-time
        "401":
          description: Authentication is required or token is invalid
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Request data is invalid
                  details:
                    type: array
                    items:
                      type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request data is invalid
        details:
          type: array
          items:
            type: string
    IdResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    RegisterRequest:
      type: object
      required:
      - fullName
      - phone
      - email
      - password
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: "^\\+?[0-9]{9,15}$"
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required:
      - identifier
      - password
      properties:
        identifier:
          type: string
          description: Email or phone
        password:
          type: string
    AuthResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - role
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - OPERATION_STAFF
          - MANAGEMENT
    CustomerProfile:
      type: object
      required:
      - id
      - fullName
      - phone
      - email
      - status
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    UpdateCustomerRequest:
      type: object
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: "^\\+?[0-9]{9,15}$"
        email:
          type: string
          format: email
    RideHistoryItem:
      type: object
      required:
      - rideId
      - pickup
      - destination
      - status
      - createdAt
      properties:
        rideId:
          type: string
          format: uuid
        pickup:
          type: string
        destination:
          type: string
        status:
          type: string
        fareAmount:
          type: number
          minimum: 0
        createdAt:
          type: string
          format: date-time
  responses:
    Unauthorized:
      description: Authentication is required or token is invalid
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                example: VALIDATION_ERROR
              message:
                type: string
                example: Request data is invalid
              details:
                type: array
                items:
                  type: string
    Forbidden:
      description: Authenticated user does not have permission
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                example: VALIDATION_ERROR
              message:
                type: string
                example: Request data is invalid
              details:
                type: array
                items:
                  type: string
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                example: VALIDATION_ERROR
              message:
                type: string
                example: Request data is invalid
              details:
                type: array
                items:
                  type: string
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                example: VALIDATION_ERROR
              message:
                type: string
                example: Request data is invalid
              details:
                type: array
                items:
                  type: string
    ValidationError:
      description: Request data failed validation
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                example: VALIDATION_ERROR
              message:
                type: string
                example: Request data is invalid
              details:
                type: array
                items:
                  type: string
